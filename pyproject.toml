[project]
name = "snowflake-dbt-airbnb"
version = "0.1.0"
description = "Airbnb dbt project for Snowflake"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-snowflake>=1.12.4",
]

[project.scripts]
snowflake-dbt-airbnb = "snowflake_dbt_airbnb:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
